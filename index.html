<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D6A33">
<title>Yjeek Field CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--green:#1D6A33;--green-d:#154D25;--gold:#CAA34D;--ink:#1A1A1A;--mute:#6B7280;--line:#E5E7EB;--bg:#F4F6F4;--card:#FFFFFF;--light:#EEF5F0;--callout:#FFF8E1;--red:#B42318;--red-bg:#FEE4E2;--amber:#B54708;--amber-bg:#FEF0C7;--ok:#067647;--ok-bg:#DCFAE6;--r:12px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit}
a{color:var(--green)}
#app{min-height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header.top .logo{width:30px;height:30px;border-radius:8px;background:var(--gold);display:grid;place-items:center;color:var(--green-d);font-weight:700}
header.top h1{font-size:16px;margin:0;flex:1;font-weight:600}
header.top button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:6px 10px}
nav.tabs{position:sticky;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 8px;color:var(--mute);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button.on{color:var(--green);font-weight:600}
nav.tabs svg{width:22px;height:22px}
main{flex:1;padding:14px 16px 24px;max-width:1100px;width:100%;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{border:1px solid var(--green);background:var(--green);color:#fff;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:42px}
.btn.sec{background:#fff;color:var(--green)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1A1A1A}
.btn.danger{background:#fff;border-color:var(--red);color:var(--red)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5}
input[type=text],input[type=search],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=password],input[type=time],select,textarea{width:100%;border:1px solid #D1D5DB;border-radius:10px;padding:10px 12px;background:#fff;min-height:42px}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--mute);margin:8px 0 4px;font-weight:500}
label.f.req::after{content:" *";color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:720px){.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.grid2d{display:grid;grid-template-columns:1fr 1fr;gap:12px}}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--light);color:var(--green-d);white-space:nowrap}
.pill.red{background:var(--red-bg);color:var(--red)}.pill.amber{background:var(--amber-bg);color:var(--amber)}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.grey{background:#EEE;color:#555}.pill.gold{background:#F6EBCF;color:#7A5A0E}
.list .item{display:block;padding:12px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;cursor:pointer}
.list .item:last-child{border-bottom:0}
.item .t{font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center}
.item .s{font-size:13px;color:var(--mute);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.mute{color:var(--mute);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:720px){.tiles{grid-template-columns:repeat(5,1fr)}}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tile .n{font-size:26px;font-weight:700;color:var(--green);line-height:1.1}
.tile .l{font-size:12px;color:var(--mute);margin-top:4px}
.tile.warn .n{color:var(--red)}
.seg{display:flex;background:var(--light);border-radius:10px;padding:3px;gap:3px;overflow:auto}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:8px;color:var(--green-d);font-weight:500;white-space:nowrap}
.seg button.on{background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:720px){.modal{align-items:center}}
.modal .box{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 24px}
@media(min-width:720px){.modal .box{border-radius:16px}}
.modal h3{margin:0 0 10px;font-size:17px}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#1A1A1A;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:90vw}
.toast.err{background:var(--red)}
.back{background:none;border:0;color:#fff;font-size:22px;padding:0 6px 0 0;cursor:pointer}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:14px}
.kv div:nth-child(odd){color:var(--mute)}
.hist{border-left:3px solid var(--light);padding-left:10px;margin:8px 0}
.hist .d{font-size:12px;color:var(--mute)}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th,table.tb td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
table.tb th{color:var(--mute);font-weight:500;font-size:12px}
.chart{position:relative;height:260px}
#map{height:52vh;min-height:320px;border-radius:var(--r);border:1px solid var(--line)}
.branch{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.branch.closed{opacity:.55}
.branch input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--green)}
.days{display:flex;gap:4px}.days label{flex:1;text-align:center;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:4px 0;cursor:pointer}.days label.on{background:var(--green);color:#fff;border-color:var(--green)}
.days input{display:none}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.login .logo{width:64px;height:64px;border-radius:18px;background:var(--green);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:28px;margin:0 auto 14px}
.def{font-size:12px;color:var(--mute);margin-top:2px}
.rate{background:var(--callout)}
.wa{color:#1B8F4B;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ====================================================================== CONFIG
const API_URL = 'https://script.google.com/macros/s/AKfycbxINyDbTGczIRdnKmKz3X3sx5PhnZOie87x7W1pdd3u4Sx7GQD5nZ3wf5Ygmf1DiSiVpw/exec';
const DATA_URL = 'https://raw.githubusercontent.com/yjeektechnologies/yjeek-crm/main/data.json';   // snapshot published by the sheet script
const REFRESH_MS = 3 * 60 * 1000;
// ======================================================================
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = { token: null, user: null, meta: null, db: null, view: 'home', vendor: null, vtab: 'activity', list: { scope: 'mine', q: '', status: '', page: 1, rep: '', kind: 'vendors' }, lead: null, contact: null, charts: {}, period: 'week', from: '', to: '', drep: '', edits: [], loading: false };
try { const saved = JSON.parse(localStorage.getItem('yjeek_crm') || 'null'); if (saved && saved.token) { S.token = saved.token; S.user = saved.user; S.meta = saved.meta; } } catch (e) {}
const CLOSED = ['Signed', 'Onboarded', 'Live', 'Not interested', 'Closed/Invalid', 'Closed / Not operating', 'Duplicate'];

// ---------------------------------------------------------------------- API (writes + sign-in only)
async function api(action, params) {
  const body = Object.assign({ action: action, token: S.token }, params || {});
  let res; try { res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body), redirect: 'follow' }); } catch (e) { throw new Error('No connection — check internet'); }
  const data = await res.json();
  if (data.auth === false) { logout(); throw new Error('Session expired — sign in again'); }
  if (!data.ok && data.busy && !(params && params._retried)) { toast('Server busy — retrying in 20 s…'); await new Promise(r => setTimeout(r, 20000)); return api(action, Object.assign({}, params || {}, { _retried: true })); }
  if (!data.ok) throw new Error(data.error || 'Request failed');
  return data;
}
function toast(msg, err) { const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 5000 : 2600); }
function busy(btn, on) { if (!btn) return; if (on) { btn.dataset.t = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>'; btn.disabled = true; } else { btn.innerHTML = btn.dataset.t || btn.innerHTML; btn.disabled = false; } }
function logout() { S.token = null; S.user = null; try { localStorage.removeItem('yjeek_crm'); } catch (e) {} render(); }
const fmt = d => d ? String(d).slice(0, 10).split('-').reverse().join('/') : '—';
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const plusDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function statusPill(st) { const c = /Signed|Onboarded|Live/.test(st) ? 'ok' : /Contract sent/.test(st) ? 'gold' : /Pending/.test(st) ? 'amber' : /Not interested|Closed|Wrong|Duplicate/.test(st) ? 'grey' : /Interested|Meeting|Visited/.test(st) ? '' : 'grey'; return '<span class="pill ' + c + '">' + esc(st || 'New') + '</span>'; }
function geoPill(g) { if (!g) return '<span class="pill grey">no pin</span>'; const c = /Verified|High|Manual/.test(g) ? 'ok' : /Medium/.test(g) ? 'amber' : 'red'; return '<span class="pill ' + c + '">' + esc(g) + '</span>'; }
function tel(n) { const d = String(n || '').replace(/[^\d]/g, ''); if (!d) return ''; return d.length === 8 ? '973' + d : d; }
const inTeam = (assigned, name) => String(assigned || '').split('+').map(s => s.trim()).indexOf(name) > -1;

// ---------------------------------------------------------------------- snapshot store (IndexedDB cache + in-memory indexes)
const idb = {
  open: () => new Promise((ok, no) => { const r = indexedDB.open('yjeek_crm', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }),
  get: async k => { try { const d = await idb.open(); return await new Promise((ok, no) => { const r = d.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); } catch (e) { return null; } },
  set: async (k, v) => { try { const d = await idb.open(); await new Promise((ok, no) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = ok; t.onerror = () => no(t.error); }); } catch (e) {} }
};
function expand(tbl) { const k = tbl.k; return tbl.r.map(r => { const o = {}; k.forEach((key, i) => o[key] = r[i]); return o; }); }
function buildDB(raw) {
  const db = { generated: raw.generated, meta: raw.meta, vendors: expand(raw.vendors), branches: expand(raw.branches), activities: expand(raw.activities), terms: expand(raw.terms), pending: expand(raw.pending), menuQueue: raw.menuQueue ? expand(raw.menuQueue) : [], removals: raw.removals ? expand(raw.removals) : [], contacts: raw.contacts ? expand(raw.contacts) : [], leads: raw.leads ? expand(raw.leads) : [], cById: {}, lById: {}, actOfLead: {}, byId: {}, brOf: {}, actOf: {}, termOf: {} };
  db.rootCount = {}; db.vendors.forEach(v => { v.vid = String(v['Vendor ID']); v.pending = false; db.byId[v.vid] = v; const rc = String(v['Root CR']); db.rootCount[rc] = (db.rootCount[rc] || 0) + 1; });
  db.branches.forEach(b => { b.vid = String(b['Vendor ID']); (db.brOf[b.vid] = db.brOf[b.vid] || []).push(b); });
  Object.values(db.brOf).forEach(list => list.sort((a, c) => (Number(String(a['Branch CR']).split('-')[1]) || 0) - (Number(String(c['Branch CR']).split('-')[1]) || 0)));
  db.activities.forEach(a => { a.vid = String(a['Vendor ID'] || ''); if (a.vid) (db.actOf[a.vid] = db.actOf[a.vid] || []).push(a); const lid = String(a['Lead ID'] || ''); if (lid) (db.actOfLead[lid] = db.actOfLead[lid] || []).push(a); });
  Object.values(db.actOfLead).forEach(list => list.sort((a, c) => (c.Date > a.Date ? 1 : c.Date < a.Date ? -1 : c.row - a.row)));
  db.contacts.forEach(c => { c.id = String(c['Contact ID']); db.cById[c.id] = c; }); db.leads.forEach(l => { l.id = String(l['Lead ID']); l.cids = String(l['Contact IDs'] || '').split(',').map(x => x.trim()).filter(Boolean); db.lById[l.id] = l; });
  Object.values(db.actOf).forEach(list => list.sort((a, c) => (c.Date > a.Date ? 1 : c.Date < a.Date ? -1 : c.row - a.row)));
  db.terms.forEach(t => { const list = String(t['Brands Joining'] || '').split(',').map(x => x.trim()).filter(Boolean); if (!list.length) list.push(String(t['Vendor ID'])); list.concat([String(t['Vendor ID'])]).forEach(k => db.termOf[k] = t); });
  db.pending.forEach(p => { p.vid = String(p['Root CR']); p.pending = true; });
  db.removalOf = {}; db.removals.forEach(r => { const k = String(r['Vendor ID']); if (!db.removalOf[k] || r.Submitted > db.removalOf[k].Submitted) db.removalOf[k] = r; });
  db.invoices = raw.invoices ? expand(raw.invoices) : []; db.payments = raw.payments ? expand(raw.payments) : []; db.devices = raw.devices ? expand(raw.devices) : []; indexFlow(db);
  return db;
}
function applyEdits(db) {   // re-apply our own recent changes on top of a (possibly older) snapshot
  const cutoff = Date.now() - 15 * 60 * 1000; S.edits = S.edits.filter(e => e.t > cutoff);
  S.edits.forEach(e => { try { e.fn(db); } catch (x) {} });
  patches().forEach(p => { const vv = db.byId[p.vid]; if (vv) Object.keys(p.f).forEach(k => vv[k] = p.f[k]); });
}
// field patches survive a page reload (localStorage) until the snapshot catches up (15 min max)
function patches() { try { const cutoff = Date.now() - 15 * 60 * 1000; return (JSON.parse(localStorage.getItem('yjeek_patches') || '[]')).filter(p => p.t > cutoff); } catch (e) { return []; } }
function patch(vid, f) { try { const list = patches(); list.push({ t: Date.now(), vid: String(vid), f: f }); localStorage.setItem('yjeek_patches', JSON.stringify(list)); } catch (e) {} }
function remember(fn) { S.edits.push({ t: Date.now(), fn: fn }); fn(S.db); }
async function loadDB(force) {
  if (S.loading) return; S.loading = true;
  try {
    if (!S.db) { const cached = await idb.get('snapshot'); if (cached) { S.db = buildDB(cached); applyEdits(S.db); if (S.token) render(); } }
    const r = await fetch(DATA_URL + '?v=' + Math.floor(Date.now() / 60000), { cache: 'no-store' });
    if (!r.ok) throw new Error('snapshot ' + r.status);
    const raw = await r.json();
    if (!S.db || raw.generated !== S.db.generated || force) { S.db = buildDB(raw); applyEdits(S.db); idb.set('snapshot', raw); if (S.token) render(); }
    S.dbError = '';
  } catch (e) { S.dbError = e.message; if (!S.db && S.token) render(); }
  finally { S.loading = false; }
}
setInterval(() => { if (S.token && document.visibilityState === 'visible') loadDB(); }, REFRESH_MS);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.token) loadDB(); });
const M = () => (S.db && S.db.meta) || S.meta || { statuses: [], activities: [], outcomes: [], reps: [], teams: [], days: [], shiftChoices: [], termsCols: [], payMethods: [], schedules: [] };

// ====================================================================== shell
function render() {
  const app = $('#app');
  if (!S.token) { app.innerHTML = loginView(); return; }
  if (!S.db) { app.innerHTML = `<header class="top"><div class="logo">Y</div><h1>Yjeek CRM</h1></header><main><div class="card"><p class="mute">${S.dbError ? 'Could not load data: ' + esc(S.dbError) + ' <button class="btn sm sec" onclick="loadDB(true)">Retry</button>' : 'Loading data…'}</p></div></main>`; return; }
  const mgr = S.user.role === 'manager';
  const age = Math.round((Date.now() - new Date(S.db.generated).getTime()) / 60000);
  app.innerHTML = `
  <header class="top">${['vendor', 'progress', 'lead', 'contact'].indexOf(S.view) > -1 ? '<button class="back" onclick="go(S.prevView||\'home\')">‹</button>' : '<div class="logo">Y</div>'}
    <h1>${S.view === 'vendor' && S.vendor ? esc(S.vendor['Brand (Trade Name)']) : S.view === 'lead' && S.lead ? esc(S.lead['Brand Name']) : S.view === 'contact' && S.contact ? esc(S.contact.Name) : { home: 'Today', vendors: 'Pipeline', dash: 'Dashboard', pins: 'Pin check', approvals: 'To-do', progress: 'My progress', billing: 'Billing', devices: 'Devices', golive: 'Go-live' }[S.view] || 'Yjeek CRM'}</h1>
    <span style="color:#fff;opacity:.8;font-size:12px" title="snapshot age">${age < 1 ? 'live' : age + ' min'}</span><span style="color:#fff;opacity:.85;font-size:13px">${esc(S.user.name)}</span><button onclick="logout()">Sign out</button></header>
  <main id="main"></main>
  <nav class="tabs">
    ${isSales() ? tab('home', 'Today', 'M3 12l9-9 9 9M5 10v10h14V10') : ''}
    ${ROLE() === 'accountant' || mgr ? tab('billing', 'Billing', 'M4 4h16v16H4zM8 9h8M8 13h8M8 17h5') : ''}
    ${ROLE() === 'purchasing' || mgr ? tab('devices', 'Devices', 'M7 2h10a2 2 0 012 2v16a2 2 0 01-2 2H7a2 2 0 01-2-2V4a2 2 0 012-2zM11 18h2') : ''}
    ${ROLE() === 'ops' || mgr ? tab('golive', 'Go-live', 'M5 3l14 9-14 9V3z') : ''}
    ${ROLE() !== 'purchasing' ? tab('vendors', 'Pipeline', 'M4 6h16M4 12h16M4 18h10') : ''}
    ${mgr ? tab('dash', 'Dashboard', 'M4 20V10M10 20V4M16 20v-7M22 20H2') : ''}
    ${mgr ? tab('approvals', 'To-do' + (pendingCount() ? ' (' + pendingCount() + ')' : ''), 'M9 12l2 2 4-4M12 22a10 10 0 100-20 10 10 0 000 20z') : ''}
    ${mgr ? tab('pins', 'Pins', 'M12 21s-7-6-7-11a7 7 0 0114 0c0 5-7 11-7 11zM12 10a2 2 0 100-4 2 2 0 000 4z') : ''}
  </nav>`;
  if (S.view === 'home' && !isSales()) S.view = roleHome();
  ({ home: homeView, vendors: vendorsView, vendor: vendorView, lead: leadView, contact: contactView, dash: dashView, pins: pinsView, approvals: approvalsView, progress: progressView, billing: billingView, devices: devicesView, golive: goliveView })[S.view]();
}
const pendingCount = () => S.db ? S.db.pending.filter(p => p.Status === 'Pending').length + (S.db.removals || []).filter(r => r.Status === 'Pending').length + S.db.vendors.filter(v => v['Menu Setup'] === 'Pending' || v['Menu Setup'] === 'In progress').length + (S.db.terms || []).filter(t => t['Pay Terms Status'] === 'Pending approval').length : 0;
const tab = (v, l, p) => `<button class="${S.view === v ? 'on' : ''}" onclick="go('${v}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${p}"/></svg>${l}</button>`;
function go(v) { if (['vendor', 'lead', 'contact'].indexOf(S.view) < 0) S.prevView = S.view; S.view = v; render(); }

// ====================================================================== login
function loginView() {
  return `<div class="login"><div class="logo">Y</div><h2 style="text-align:center;margin:0 0 4px">Yjeek Field CRM</h2><p class="mute" style="text-align:center;margin:0 0 18px">Vendor pipeline · Bahrain</p>
  <div class="card"><label class="f">Your name</label><select id="ln"><option value="">Loading…</option></select>
  <label class="f">PIN</label><input id="lp" type="password" inputmode="numeric" maxlength="6" placeholder="4–6 digits" onkeydown="if(event.key==='Enter')doLogin(document.querySelector('#lbtn'))">
  <div style="margin-top:14px"><button id="lbtn" class="btn" style="width:100%" onclick="doLogin(this)">Sign in</button></div>
  <p class="mute" id="lerr" style="margin:10px 0 0"></p></div></div>`;
}
async function loadReps() {
  const sel = $('#ln'); if (!sel) return;
  const names = m => m && (m.staff ? m.staff.map(x => x.name) : m.reps);

// ====================================================================== queries on the snapshot
function allVendors() { return S.db.vendors.concat(S.db.pending.filter(p => p.Status === 'Pending')); }
function vendorsQuery(o) {
  const q = (o.q || '').toLowerCase(); const today = todayISO(); const rep = o.rep;
  const out = allVendors().filter(v => {
    const asg = v.pending ? v.Rep : v['Assigned To'];
    if (o.scope === 'mine' || o.scope === 'due') { if (rep ? !inTeam(asg, rep) : !asg) return false; }
    else if (o.scope === 'unassigned') { if (asg) return false; }
    else if (S.user.role === 'manager' && rep && !inTeam(asg, rep)) return false;
    const st = v.pending ? 'Pending approval' : (v.Status || 'New');
    if (o.status && st !== o.status) return false;
    if (q) { const hay = [v.vid, v['Root CR'], v['Brand (Trade Name)'], v['Legal Name (EN)'], v['Main Area'], v['Decision Maker'], v['Best Number'], v['All Numbers']].join(' ').toLowerCase(); if (hay.indexOf(q) < 0) return false; }
    if (o.scope === 'due') { const nd = v['Next Follow-up (auto)']; if (!nd || nd > today || CLOSED.indexOf(st) > -1) return false; }
    return true;
  });
  const rank = v => { if (v.pending) return 0; const st = v.Status; if (CLOSED.indexOf(st) > -1) return 9e15; const nd = v['Next Follow-up (auto)']; return nd ? new Date(nd).getTime() : 8e15; };
  out.sort((a, c) => rank(a) - rank(c) || String(a['Brand (Trade Name)']).localeCompare(String(c['Brand (Trade Name)'])));
  return out;
}
function vendorItem(v) {
  const nd = v['Next Follow-up (auto)']; const late = nd && nd < todayISO(); const asg = v.pending ? v.Rep : v['Assigned To'];
  const br = v.pending ? 1 : (Number(v.Branches) || (S.db.brOf[v.vid] || []).length);
  return `<a class="item" onclick="openVendor('${esc(v.vid)}')"><div class="t"><span>${esc(v['Brand (Trade Name)'])} <span class="mute" style="font-weight:400">· ${esc(v['Root CR'])}</span></span>${statusPill(v.pending ? 'Pending approval' : v.Status)}</div>
  <div class="s"><span>${esc(v['Main Area'] || '—')}</span><span>${br} branch${br === 1 ? '' : 'es'}</span>${asg ? '<span>' + esc(asg) + '</span>' : '<span class="pill grey">unassigned</span>'}${S.db.rootCount && S.db.rootCount[String(v['Root CR'])] > 1 ? '<span class="pill grey">group · ' + S.db.rootCount[String(v['Root CR'])] + ' brands</span>' : ''}${nd ? `<span class="${late ? 'pill red' : ''}">next ${fmt(nd)}</span>` : ''}</div></a>`;
}

function periodRange(p) {
  const d = new Date(); const iso = x => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
  const dow = (d.getDay() + 1) % 7;  // week starts Saturday

  if (p === 'today') {} else if (p === 'week') { a.setDate(d.getDate() - dow); } else if (p === 'lastweek') { a.setDate(d.getDate() - dow - 7); b.setDate(d.getDate() - dow - 1); }
  else if (p === 'month') { a = new Date(d.getFullYear(), d.getMonth(), 1); } else if (p === 'lastmonth') { a = new Date(d.getFullYear(), d.getMonth() - 1, 1); b = new Date(d.getFullYear(), d.getMonth(), 0); }
  else if (p === 'quarter') { a = new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3, 1); } else if (p === 'year') { a = new Date(d.getFullYear(), 0, 1); }
  else if (p === 'custom') { return { from: S.from || iso(a), to: S.to || iso(b) }; }
  return { from: iso(a), to: iso(b) };
}
function computeDash(from, to, rep) {

  const byDay = {}, byRep = {}, byOutcome = {}, funnel = {}, perRep = {}; let unassigned = 0, signedVendors = 0, signedInRange = 0, contractSentNow = 0, dueToday = 0, overdue = 0;
  db.activities.forEach(a => { const d = String(a.Date).slice(0, 10); if (!inR(d) || !repOk(a.Salesperson)) return; const kind = /visit/i.test(a.Activity) ? 'visits' : /meeting/i.test(a.Activity) ? 'meetings' : /call|whatsapp|phone/i.test(a.Activity) ? 'calls' : 'other';
    byDay[d] = byDay[d] || { calls: 0, visits: 0, meetings: 0, other: 0, total: 0 }; byDay[d][kind]++; byDay[d].total++;
    const w = a.Salesperson || '—'; byRep[w] = byRep[w] || { calls: 0, visits: 0, meetings: 0, other: 0, total: 0 }; byRep[w][kind]++; byRep[w].total++; const o = a.Outcome || '—'; byOutcome[o] = (byOutcome[o] || 0) + 1; });
  db.vendors.forEach(v => { const asg = v['Assigned To'] || ''; const st = v.Status || 'New'; if (!asg) unassigned++; if (!repOk(asg)) return; funnel[st] = (funnel[st] || 0) + 1;
    asg.split('+').map(s => s.trim()).filter(Boolean).forEach(n => { perRep[n] = perRep[n] || { vendors: 0, signed: 0, contractSent: 0, overdue: 0 }; perRep[n].vendors++; if (/Signed|Onboarded/.test(st)) perRep[n].signed++; if (st === 'Contract sent') perRep[n].contractSent++; });
    if (/Signed|Onboarded/.test(st)) { signedVendors++; if (inR(String(v['Signed Date']).slice(0, 10))) signedInRange++; } if (st === 'Contract sent') contractSentNow++;
    const nd = v['Next Follow-up (auto)']; if (nd && CLOSED.indexOf(st) < 0) { if (nd < today) { overdue++; asg.split('+').map(s => s.trim()).filter(Boolean).forEach(n => { perRep[n] = perRep[n] || { vendors: 0, signed: 0, contractSent: 0, overdue: 0 }; perRep[n].overdue++; }); } else if (nd === today) dueToday++; } });
  let branchesSigned = 0, branchesJoining = 0; db.branches.forEach(b => { if (!repOk(b['Assigned To (auto)'])) return; if (/Signed|Onboarded/.test(b['Vendor Status (auto)'])) branchesSigned++; if (b['Include in contract'] && !b.Closed) branchesJoining++; });
  const days = []; for (let d = new Date(from); d <= new Date(to); d.setDate(d.getDate() + 1)) { const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); days.push(Object.assign({ day: k }, byDay[k] || { calls: 0, visits: 0, meetings: 0, other: 0, total: 0 })); }

  return { days, byRep, byOutcome, funnel, perRep, tiles: { contactsNew: contacts.filter(c => inR(String(c.Created).slice(0, 10))).length, leadsOpen: leads.filter(LEAD_OPEN).length, leadsConverted: leads.filter(l => l.Status === 'Converted' && inR(String(l['Converted On']).slice(0, 10))).length, leadsStale: leads.filter(leadStale).length, activities: days.reduce((s, x) => s + x.total, 0), visits: days.reduce((s, x) => s + x.visits, 0), signedInRange, signedVendors, branchesSigned, branchesJoining, contractSentNow, overdue, dueToday, unassigned, pending: S.db.pending.filter(p => p.Status === 'Pending').length, menus: S.db.vendors.filter(v => v['Menu Setup'] === 'Pending' || v['Menu Setup'] === 'In progress').length, receivables: Math.round(S.db.invoices.filter(i => Number(i.Balance) > 0).reduce((s, i) => s + Number(i.Balance), 0)), overdueInv: S.db.invoices.filter(invOverdue).length, payApprovals: S.db.terms.filter(t => t['Pay Terms Status'] === 'Pending approval').length, devicesToPrep: S.db.devices.filter(d => d.Status === 'Requested').length, readyLive: S.db.vendors.filter(v => /Signed|Onboarded/.test(v.Status) && !v['Live Date'] && goLiveLocal(v).ready).length, live: S.db.vendors.filter(v => v['Live Date']).length, assetsMissing: S.db.vendors.filter(v => /Signed|Onboarded/.test(v.Status) && v['Assets Status'] !== 'Complete' && repOk(v['Assigned To'])).length } };
}

function billPill(st) { const c = /Paid$/.test(st) ? 'ok' : /overdue/i.test(st) ? 'red' : /Partially/.test(st) ? 'amber' : /Invoiced/.test(st) ? 'gold' : 'grey'; return `<span class="pill ${c}">${esc(st || 'No invoice')}</span>`; }

function invOverdue(inv) { return inv && Number(inv.Balance) > 0 && inv['Due Date'] && String(inv['Due Date']).slice(0, 10) < todayISO(); }
function invStatus(inv) { if (!inv) return 'No invoice'; return inv.Status + (invOverdue(inv) ? ' · overdue' : ''); }
function indexFlow(db) {
  db.invoices = db.invoices || []; db.payments = db.payments || []; db.devices = db.devices || []; db.invOf = {}; db.payOf = {}; db.devOf = {};
  db.invoices.forEach(i => { i.id = String(i['Invoice ID']); try { i.plan = JSON.parse(i.Plan || '[]'); } catch (e) { i.plan = []; } String(i['Vendor IDs'] || '').split(',').map(x => x.trim()).filter(Boolean).forEach(v => db.invOf[v] = i); });
  db.payments.forEach(p => { (db.payOf[String(p['Invoice ID'])] = db.payOf[String(p['Invoice ID'])] || []).push(p); });

async function savePayTerms(btn) {

  if (p.schedule !== 'Full') { const sum = p.plan.reduce((s, q) => s + q.amount, 0); if (Math.abs(sum - ptNet()) > 0.5) { toast('Parts add up to ' + money(sum) + ' but the net fee is ' + money(ptNet()), true); return; } if (p.plan.some(q => q.when === '')) { toast('Pick a due date for every instalment', true); return; } }
  busy(btn, true);
  try { const r = await api('savePayTerms', { vid: S.vendor.vid, terms: p }); S.payTerms = { vid: S.vendor.vid, terms: r.terms }; toast(r.terms.status === 'Pending approval' ? 'Sent to a manager for approval' : 'Payment terms saved'); contractTab(); } catch (e) { toast(e.message, true); busy(btn, false); }
}
async function reviewPayTerms(vid, approve, btn) { const note = ($('#ptn_' + vid.replace(/[^a-z0-9]/gi, '_')) || {}).value || ''; if (!approve && !note.trim()) { toast('Tell the rep why', true); return; } busy(btn, true); try { await api('reviewPayTerms', { vid: vid, approve: approve, note: note }); remember(db => { const t = db.termOf[vid]; if (t) { t['Pay Terms Status'] = approve ? 'Approved' : 'Rejected'; t['Pay Approved By'] = S.user.name; } }); toast(approve ? 'Approved' : 'Rejected'); render(); } catch (e) { toast(e.message, true); busy(btn, false); } }

async function markInvoiced(id, btn) { const no = $('#bi_no').value.trim(); if (!no) { toast('Invoice number is required', true); return; } busy(btn, true); try { const r = await api('markInvoiced', { id: id, no: no, date: $('#bi_date').value, notes: $('#bi_notes').value }); remember(db => { const i = db.invoices.find(x => x.id === id); if (i) { i['Invoice No'] = no; i['Invoice Date'] = $('#bi_date').value; i.Status = r.status; i['Invoiced By'] = S.user.name; const d = new Date($('#bi_date').value); d.setDate(d.getDate() + (Number(i['Due Days']) || 7)); i['Due Date'] = d.toISOString().slice(0, 10); String(i['Vendor IDs']).split(',').forEach(v => { const vv = db.byId[v.trim()]; if (vv) vv['Billing Status'] = r.status; }); } }); toast('Marked invoiced'); render(); } catch (e) { toast(e.message, true); busy(btn, false); } }
async function recordPayment(id, btn) { const p = { amount: Number($('#bp_amt').value), date: $('#bp_date').value, method: $('#bp_m').value, reference: $('#bp_ref').value, notes: $('#bp_notes').value }; if (!(p.amount > 0)) { toast('Amount must be more than 0', true); return; } busy(btn, true); try { const r = await api('recordPayment', { id: id, payment: p }); remember(db => { const i = db.invoices.find(x => x.id === id); if (i) { i['Paid Total'] = r.paid; i.Balance = r.balance; i.Status = r.status; (db.payOf[id] = db.payOf[id] || []).unshift({ 'Invoice ID': id, Date: p.date, Amount: p.amount, Method: p.method, Reference: p.reference, 'Received By': S.user.name, Notes: p.notes }); String(i['Vendor IDs']).split(',').forEach(v => { const vv = db.byId[v.trim()]; if (vv) vv['Billing Status'] = r.status; }); } }); toast('Payment recorded · balance ' + money(r.balance)); render(); } catch (e) { toast(e.message, true); busy(btn, false); } }

async function requestDevices(btn) { const lines = []; document.querySelectorAll('[data-dv]').forEach(i => { if (i.value !== '') lines.push({ cr: i.dataset.dv, qty: Number(i.value) || 0 }); }); if (!lines.some(l => l.qty > 0)) { toast('Enter at least one device', true); return; } busy(btn, true); try { await api('requestDevices', { vid: S.vendor.vid, lines: lines }); remember(db => { const vv = db.byId[S.vendor.vid]; if (vv) vv['Devices Status'] = 'Requested'; lines.forEach(l => { const ex = (db.devOf[S.vendor.vid] || []).find(d => String(d['Branch CR']) === l.cr); if (ex) { if (l.qty) ex.Qty = l.qty; else { ex.Status = 'Cancelled'; db.devOf[S.vendor.vid] = db.devOf[S.vendor.vid].filter(x => x !== ex); } } else if (l.qty) { const d = { 'Request ID': 'tmp' + l.cr, id: 'tmp' + l.cr, vid: S.vendor.vid, 'Vendor ID': S.vendor.vid, 'Branch CR': l.cr, 'Branch Area': ((db.brOf[S.vendor.vid] || []).find(b => String(b['Branch CR']) === l.cr) || {}).Area, Qty: l.qty, 'Requested By': S.user.name, 'Requested On': todayISO(), Status: 'Requested' }; (db.devOf[S.vendor.vid] = db.devOf[S.vendor.vid] || []).push(d); db.devices.push(d); } }); }); toast('Request sent to purchasing'); render(); } catch (e) { toast(e.message, true); busy(btn, false); } }

  const signed = S.db.vendors.filter(v => /Signed|Onboarded/.test(v.Status) && !v['Live Date']); const ready = signed.filter(v => goLiveLocal(v).ready); const waiting = signed.filter(v => !goLiveLocal(v).ready);
  const menus = S.db.vendors.filter(v => v['Menu Setup'] && v['Menu Setup'] !== 'Done').sort((a, c) => a['Menu Setup'] === 'In progress' ? -1 : 1);
  const live = S.db.vendors.filter(v => v['Live Date']).sort((a, c) => String(c['Live Date']).localeCompare(String(a['Live Date'])));
  const gate = v => { const g = goLiveLocal(v); return `<span class="pill ${g.payOk ? 'ok' : 'red'}">pay</span><span class="pill ${g.devOk ? 'ok' : 'amber'}">devices</span><span class="pill ${g.menuOk ? 'ok' : 'amber'}">menu</span>`; };
  $('#main').innerHTML = `<div class="tiles" style="margin-bottom:12px"><div class="tile ${ready.length ? 'warn' : ''}"><div class="n">${ready.length}</div><div class="l">Ready to go live</div></div><div class="tile"><div class="n">${waiting.length}</div><div class="l">Signed, not ready</div></div><div class="tile ${menus.length ? 'warn' : ''}"><div class="n">${menus.length}</div><div class="l">Menus to set up</div></div><div class="tile"><div class="n">${live.length}</div><div class="l">Live vendors</div></div></div>
    <div class="card"><h2>Ready to go live <span class="pill ${ready.length ? 'gold' : 'ok'}">${ready.length}</span></h2><p class="mute">Payment per schedule ✓, devices delivered & trained ✓, menu set up ✓. Switch the vendor on in the admin portal, then mark Live.</p><div class="list">${ready.map(v => `<div class="item"><div class="t"><span onclick="openVendor('${esc(v.vid)}')" style="cursor:pointer">${esc(v['Brand (Trade Name)'])} · ${esc(v['Root CR'])}</span><button class="btn sm gold" onclick="goLive('${esc(v.vid)}',false,this)">Mark Live</button></div><div class="s">${gate(v)}<span>${esc(v['Assigned To'])}</span></div></div>`).join('') || '<p class="mute">Nothing ready.</p>'}</div></div>
    <div class="card"><h2>Menu setups waiting <span class="pill ${menus.length ? 'amber' : 'ok'}">${menus.length}</span></h2><div class="list">${menus.map(v => `<div class="item"><div class="t"><span onclick="openVendor('${esc(v.vid)}')" style="cursor:pointer">${esc(v['Brand (Trade Name)'])} · ${esc(v['Root CR'])}</span><span class="pill ${v['Menu Setup'] === 'In progress' ? 'gold' : 'amber'}">${esc(v['Menu Setup'])}</span></div><div class="s"><span>${esc(v['Menu Type'] || '')}</span>${v.Menu ? `<a href="${esc(v.Menu)}" target="_blank">menu</a>` : ''}${v.Logo ? `<a href="${esc(v.Logo)}" target="_blank">logo</a>` : ''}${v.Banner ? `<a href="${esc(v.Banner)}" target="_blank">banner</a>` : ''}<span>${esc(v['Assigned To'])}</span></div><div class="row" style="margin-top:6px">${v['Menu Setup'] !== 'In progress' ? `<button class="btn sm sec" onclick="menuSetup('${esc(v.vid)}','In progress',this)">Start</button>` : ''}<button class="btn sm" onclick="menuSetup('${esc(v.vid)}','Done',this)">Mark Done</button><button class="btn sm sec" onclick="menuSetup('${esc(v.vid)}','On hold',this)">On hold</button></div></div>`).join('') || '<p class="mute">Nothing waiting.</p>'}</div></div>
    <div class="card"><h2>Signed — waiting on something <span class="pill grey">${waiting.length}</span></h2><div class="list">${waiting.slice(0, 60).map(v => `<div class="item"><div class="t"><span onclick="openVendor('${esc(v.vid)}')" style="cursor:pointer">${esc(v['Brand (Trade Name)'])} · ${esc(v['Root CR'])}</span>${ROLE() === 'manager' ? `<button class="btn sm sec" onclick="goLiveOverride('${esc(v.vid)}')">Go live anyway</button>` : ''}</div><div class="s">${gate(v)}<span>signed ${fmt(v['Signed Date'])}</span><span>${esc(v['Assigned To'])}</span></div></div>`).join('') || '<p class="mute">—</p>'}</div></div>
    <div class="card"><h2>Live <span class="pill ok">${live.length}</span></h2><div class="list">${live.slice(0, 40).map(v => `<a class="item" onclick="openVendor('${esc(v.vid)}')"><div class="t"><span>${esc(v['Brand (Trade Name)'])} · ${esc(v['Root CR'])}</span><span class="pill ok">live ${fmt(v['Live Date'])}</span></div></a>`).join('') || '<p class="mute">—</p>'}</div></div>`;
}
async function goLive(vid, override, btn, note) { busy(btn, true); try { await api('goLive', { vid: vid, override: !!override, note: note || '' }); remember(db => { const v = db.byId[vid]; if (v) { v['Live Date'] = todayISO(); v['Live By'] = S.user.name; v.Status = 'Live'; v['Go-live Ready'] = 'Live'; } }); closeModal(); toast('Live 🎉'); render(); } catch (e) { toast(e.message, true); busy(btn, false); } }
function goLiveOverride(vid) { const v = S.db.byId[vid]; const g = goLiveLocal(v); modal(`<h3>Go live before all checks pass?</h3><p class="mute">${esc(v['Brand (Trade Name)'])} — ${[g.payOk ? '' : 'payment: ' + g.payWhy, g.devOk ? '' : 'devices ' + (v['Devices Status'] || 'not requested').toLowerCase(), g.menuOk ? '' : 'menu not set up'].filter(Boolean).join(' · ')}</p><label class="f req">Reason</label><input id="gl_note"><div class="row" style="margin-top:12px"><button class="btn gold grow" onclick="goLive('${esc(vid)}',true,this,$('#gl_note').value)">Go live anyway</button><button class="btn sec" onclick="closeModal()">Cancel</button></div>`); }

// manager To-do: payment-terms approvals
function payApprovalsCard() {
  const list = S.db.terms.filter(t => t['Pay Terms Status'] === 'Pending approval');
  return `<div class="card"><h2>Payment terms to approve <span class="pill ${list.length ? 'amber' : 'ok'}">${list.length}</span></h2><p class="mute">Non-standard terms agreed by the rep while closing (discount, split, instalments, longer due). Approve → the accountant invoices exactly this. Reject with a note → the rep fixes the terms.</p>
    <div class="list">${list.map(t => { const vid = String(t['Vendor ID']).split('#')[0]; const v = S.db.byId[String(t['Brands Joining'] || '').split(',')[0].trim()] || S.db.byId[vid] || {}; let plan = []; try { plan = JSON.parse(t['Pay Plan'] || '[]'); } catch (e) {} const gross = Number(String(t['Onboarding Fee'] || '').replace(/[^\d.]/g, '')) || 0; const key = String(t['Vendor ID']); return `<div class="item"><div class="t"><span onclick="S.vtab='contract';openVendor('${esc(v.vid || vid)}')" style="cursor:pointer">${esc(t['Legal Business Name'])} · CR ${esc(t['Root CR'])}</span><span class="pill amber">${esc(t['Pay Schedule'] || 'Full')}</span></div><div class="s"><span>fee ${money(gross)}${Number(t['Pay Discount']) ? ' − ' + money(t['Pay Discount']) + ' (' + esc(t['Pay Discount Reason']) + ')' : ''} = <b>${money(gross - (Number(t['Pay Discount']) || 0))}</b></span><span>due ${esc(t['Pay Due Days'])} days</span><span>${planText(plan)}</span><span>${esc(t['Pay Requested By'])}</span>${t['Pay Terms Note'] ? '<span>' + esc(t['Pay Terms Note']) + '</span>' : ''}</div>
      <div class="row" style="margin-top:6px"><input id="ptn_${key.replace(/[^a-z0-9]/gi, '_')}" placeholder="Note to rep (required to reject)" style="flex:1"><button class="btn sm" onclick="reviewPayTerms('${esc(key)}',true,this)">Approve</button><button class="btn sm danger" onclick="reviewPayTerms('${esc(key)}',false,this)">Reject</button></div></div>`; }).join('') || '<p class="mute">Nothing waiting.</p>'}</div></div>`;
}

function modal(html) { closeModal(); const d = document.createElement('div'); d.className = 'modal'; d.id = 'modal'; d.innerHTML = '<div class="box">' + html + '</div>'; d.addEventListener('click', e => { if (e.target === d) closeModal(); }); document.body.appendChild(d); }
function closeModal() { const d = $('#modal'); if (d) d.remove(); }
render(); loadDB().then(() => { if (!S.token) loadReps(); }); if (!S.token) loadReps();
</script>
</body>
</html>
